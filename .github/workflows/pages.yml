name: Deploy site to GitHub Pages

on:
  # Any push to main rebuilds. An earlier path filter here missed sitegen/,
  # so edits to the build modules silently published nothing; the build takes
  # seconds, so filtering is not worth that failure mode.
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build-site.py uses only the standard library, so there is nothing to install.
      - name: Build dist/
        run: python3 build-site.py

      # Skip Jekyll processing; the site is already plain HTML.
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
